plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

version = project.mod_version
group = 'dev.minecraftai'

loom {
    splitEnvironmentSourceSets()
    mods {
        engineer {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    from('../catalog/mechanisms.json') { into 'engineer' }
    from('../catalog/shutter.json') { into 'engineer' }
    from('../tests/fixtures/shutter-design.json') { into 'engineer/fixtures' }
    from('../tests/fixtures/shutter-trace.json') { into 'engineer/fixtures' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

fabricApi {
    configureTests {
        createSourceSet = false
        modId = 'engineer'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        username = providers.gradleProperty('mceClientName').getOrElse('Player0')
    }
}

if (providers.gradleProperty('mceTestRunDir').isPresent()) {
    loom.runs.clientGameTest {
        runDir providers.gradleProperty('mceTestRunDir').get()
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
        vmArg '-Xmx1536m'
        // Concurrent native clients must not rewrite each other's loaded libraries.
        vmArg "-Dorg.lwjgl.system.SharedLibraryExtractPath=${file(providers.gradleProperty('mceTestRunDir').get() + '/natives').absolutePath}"
        vmArg '-Dorg.lwjgl.system.SharedLibraryExtractForce=true'
    }
}
