name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and versions
      description: Include Minecraft, Fabric, mod and Node versions. Use a disposable world.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Remove tokens, personal paths, world data and private chat before sharing logs.
