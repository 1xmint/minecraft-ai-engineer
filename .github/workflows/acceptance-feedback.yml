name: Multiplayer acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "mod/**"
      - "companion/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/acceptance-feedback.yml"
  push:
    branches: [work/acceptance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Dedicated-server acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npm run build
      - name: Prepare native software graphics
        run: bash "$GITHUB_WORKSPACE/scripts/ci/graphics.sh"
      - name: Owner, overlay-free editor and denied player on one saved dedicated server
        run: bash scripts/ci/acceptance.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-evidence
          path: mod/build/acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14
