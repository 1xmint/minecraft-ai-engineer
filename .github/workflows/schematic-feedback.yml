name: Schematic feedback
on:
  push:
    branches: [work/schematic-feedback]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schematic-feedback-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  schematic-feedback:
    name: Schematic feedback only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check schematic HTTP and imported admission tests
        run: |
          set -euo pipefail
          node --test --test-timeout=30000 dist/tests/schematic-library.test.js dist/tests/imported-intention.test.js 2>&1 | tee schematic-feedback.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schematic-feedback
          path: schematic-feedback.log
          if-no-files-found: warn
          retention-days: 7
