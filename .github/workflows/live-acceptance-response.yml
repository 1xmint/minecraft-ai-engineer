name: Publish validated acceptance response
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [catalog, generated, structural]
        default: catalog
      stage:
        type: choice
        options: [catalog, behavior, geometry]
        default: catalog
      request_run:
        required: true
        type: string
      request_attempt:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      result:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  response:
    if: github.repository == '1xmint/minecraft-ai-engineer' && github.actor == '1xmint' && github.triggering_actor == '1xmint'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate against the actual still-live request
        env:
          GH_TOKEN: ${{ github.token }}
          MCE_ACCEPTANCE_STAGE: ${{ inputs.stage }}
          MCE_STRUCTURAL_ACCEPTANCE: ${{ inputs.scenario == 'structural' && 'true' || 'false' }}
        run: node scripts/ci/live-transport.mjs publish-response
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mce-live-response-${{ inputs.request_run }}-${{ inputs.request_attempt }}${{ inputs.stage != 'catalog' && format('-{0}', inputs.stage) || '' }}
          path: ${{ inputs.stage == 'catalog' && 'mod/build/live-exchange/response.json' || format('mod/build/live-exchange/{0}/response.json', inputs.stage) }}
          if-no-files-found: error
          retention-days: 1
